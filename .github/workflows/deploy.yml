name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/key.pem
          chmod 400 ~/.ssh/key.pem

      - name: Copy files to EC2
        run: |
          scp -o StrictHostKeyChecking=no -i ~/.ssh/key.pem -r * ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~

      - name: Deploy on EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
            sudo mv ~/index.html /usr/share/nginx/html/ &&
            sudo mv ~/style.css /usr/share/nginx/html/ &&
            sudo mv ~/script.js /usr/share/nginx/html/ &&
            sudo mv ~/assets /usr/share/nginx/html/ &&
            sudo systemctl restart nginx
          "